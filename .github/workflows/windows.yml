name: Windows build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependency
        run: python -m pip install PyInstaller==6.17.0
      - name: Build versioned EXE
        run: python -B -X utf8 tools/build.py
      - name: Run tests, including packaged EXE check
        run: python -B -X utf8 -m unittest discover -s tests -v
