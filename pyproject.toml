[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renprofile-py"
version = "4.1.0"
description = "Rename an offline Windows user folder and migrate its settings in one operation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/zhaibingye/RenProfile-Py"
Issues = "https://github.com/zhaibingye/RenProfile-Py/issues"
Releases = "https://github.com/zhaibingye/RenProfile-Py/releases"

[project.scripts]
renprofile = "renprofile.cli:main"

[project.gui-scripts]
renprofile-gui = "renprofile.gui:main"

[tool.setuptools.packages.find]
include = ["renprofile*"]
